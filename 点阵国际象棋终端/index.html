<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Braille Dot Matrix Terminal Chess</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="terminal-shell" aria-label="Character-cell terminal chess visualization">
    <canvas id="terminal" aria-hidden="true"></canvas>
    <p class="sr-only">
      A simulated terminal screen. The chessboard, pieces, move list, material bar, ripples, captures,
      and trails are rendered by changing Braille dot-matrix glyphs inside a fixed terminal buffer.
      Press R or click Play Again after checkmate to restart the match.
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
