<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyra Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="播放器导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M21.6 5.8v14.8a5.9 5.9 0 1 1-2.6-4.9V10l-9.3 2.1v10.2a5.9 5.9 0 1 1-2.7-4.9V9.2l14.6-3.4Z" />
            </svg>
          </div>
          <div>
            <strong>Lyra Player</strong>
            <span>Local music studio</span>
          </div>
        </div>

        <nav class="nav-list" aria-label="视图切换">
          <button class="nav-item active" data-view="library" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Zm3 1.8h10M7 12h10M7 16.7h6" />
            </svg>
            曲库
          </button>
          <button class="nav-item" data-view="lyrics" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 7h8M8 11h8M8 15h5M5.5 21A2.5 2.5 0 0 1 3 18.5v-13A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-13Z" />
            </svg>
            歌词
          </button>
          <button class="nav-item" data-view="queue" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h11M4 12h9M4 17h7M17 15l3 2-3 2v-4Z" />
            </svg>
            队列
          </button>
        </nav>

        <section class="side-card">
          <span class="eyebrow">播放概览</span>
          <div class="stats-grid">
            <div>
              <strong id="statSongs">0</strong>
              <span>首歌曲</span>
            </div>
            <div>
              <strong id="statLyrics">0</strong>
              <span>份歌词</span>
            </div>
          </div>
        </section>

        <section class="shortcuts">
          <span class="eyebrow">快捷键</span>
          <p><kbd>Space</kbd> 播放/暂停</p>
          <p><kbd>←</kbd><kbd>→</kbd> 快退/快进</p>
          <p><kbd>L</kbd> 显示歌词</p>
        </section>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m21 21-4.4-4.4M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Z" />
            </svg>
            <input id="searchInput" type="search" placeholder="搜索歌曲、歌手、格式..." autocomplete="off" />
          </div>
          <div class="top-actions">
            <input id="localFolderInput" type="file" accept="audio/*,.lrc" multiple webkitdirectory hidden />
            <button class="ghost-button" id="localImportButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 19.5V7.3A2.3 2.3 0 0 1 6.3 5h4l2 2h5.4A2.3 2.3 0 0 1 20 9.3v10.2H4Zm4.5-5.3 3.5-3.5 3.5 3.5M12 10.8V18" />
              </svg>
              导入本地文件夹
            </button>
            <button class="icon-button" id="themeToggle" type="button" aria-label="切换主题">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4M12 16.2a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4Z" />
              </svg>
            </button>
            <button class="primary-button" id="playAllButton" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 5v14l11-7L7 5Z" />
              </svg>
              播放全部
            </button>
          </div>
        </header>

        <section class="hero-player" aria-label="当前播放">
          <div class="disc-stage">
            <div class="disc" id="albumDisc">
              <div class="disc-ring"></div>
              <div class="disc-core">
                <span id="discInitial">L</span>
              </div>
            </div>
            <canvas id="visualizer" width="420" height="180" aria-hidden="true"></canvas>
          </div>

          <div class="now-info">
            <p class="status-label" id="playStatus">准备播放</p>
            <h1 id="currentTitle">选择一首歌开始</h1>
            <p id="currentArtist">支持 MP3 / FLAC / WAV 与 LRC 同步歌词</p>
            <div class="format-row">
              <span id="currentFormat">LOCAL</span>
              <span id="lyricBadge">歌词待加载</span>
              <span id="sourceBadge">内置曲库</span>
            </div>
            <div class="hero-lyric" id="heroLyric">歌词会在这里跟随音乐浮现。</div>
          </div>
        </section>

        <section class="content-grid">
          <div class="panel library-panel" data-panel="library">
            <div class="panel-heading">
              <div>
                <span class="eyebrow">Library</span>
                <h2>本地曲库</h2>
              </div>
              <select id="formatFilter" aria-label="按格式筛选">
                <option value="all">全部格式</option>
                <option value="mp3">MP3</option>
                <option value="flac">FLAC</option>
                <option value="wav">WAV</option>
              </select>
            </div>
            <div class="track-list" id="trackList" aria-label="歌曲列表"></div>
          </div>

          <div class="panel lyrics-panel" data-panel="lyrics">
            <div class="panel-heading">
              <div>
                <span class="eyebrow">Lyrics</span>
                <h2>同步歌词</h2>
              </div>
              <button class="ghost-button" id="scrollLyricButton" type="button">回到当前句</button>
            </div>
            <div class="lyrics-view" id="lyricsView" aria-live="polite"></div>
          </div>

          <div class="panel queue-panel" data-panel="queue">
            <div class="panel-heading">
              <div>
                <span class="eyebrow">Queue</span>
                <h2>播放队列</h2>
              </div>
              <button class="ghost-button" id="shuffleButton" type="button">随机队列</button>
            </div>
            <div class="queue-list" id="queueList" aria-label="播放队列"></div>
          </div>
        </section>
      </main>
    </div>

    <footer class="player-bar" aria-label="播放控制">
      <audio id="audioPlayer" preload="metadata"></audio>

      <div class="mini-now">
        <div class="mini-cover" id="miniCover">L</div>
        <div>
          <strong id="miniTitle">未播放</strong>
          <span id="miniArtist">请选择曲目</span>
        </div>
      </div>

      <div class="transport">
        <div class="control-row">
          <button class="icon-button" id="modeButton" type="button" aria-label="播放模式">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h11l-2-2M15 7l-2 2M20 17H9l2 2M9 17l2-2" />
            </svg>
          </button>
          <button class="icon-button" id="prevButton" type="button" aria-label="上一首">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 5v14M18 6 9 12l9 6V6Z" />
            </svg>
          </button>
          <button class="play-button" id="playPauseButton" type="button" aria-label="播放">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7L8 5Z" />
            </svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5h3v14H8V5Zm5 0h3v14h-3V5Z" />
            </svg>
          </button>
          <button class="icon-button" id="nextButton" type="button" aria-label="下一首">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 5v14M6 6l9 6-9 6V6Z" />
            </svg>
          </button>
          <button class="icon-button" id="favoriteButton" type="button" aria-label="收藏">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 20.5-1.2-1C6.5 15.8 4 13.5 4 10.4A4.1 4.1 0 0 1 8.1 6c1.6 0 3.1.8 3.9 2 .8-1.2 2.3-2 3.9-2A4.1 4.1 0 0 1 20 10.4c0 3.1-2.5 5.4-6.8 9.1l-1.2 1Z" />
            </svg>
          </button>
        </div>
        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <input id="progressSlider" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度" />
          <span id="durationTime">0:00</span>
        </div>
      </div>

      <div class="utility-controls">
        <button class="icon-button" id="queueToggle" type="button" aria-label="播放队列">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h11M4 12h9M4 17h7M17 15l3 2-3 2v-4Z" />
          </svg>
        </button>
        <button class="icon-button" id="lyricsToggle" type="button" aria-label="显示歌词">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7h10M7 12h10M7 17h6M4.5 21A2.5 2.5 0 0 1 2 18.5v-13A2.5 2.5 0 0 1 4.5 3h15A2.5 2.5 0 0 1 22 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-15Z" />
          </svg>
        </button>
        <button class="icon-button" id="muteButton" type="button" aria-label="静音">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4Zm13 1a4 4 0 0 1 0 4M19.5 7.5a7 7 0 0 1 0 9" />
          </svg>
        </button>
        <input id="volumeSlider" type="range" min="0" max="1" value="0.82" step="0.01" aria-label="音量" />
      </div>
    </footer>

    <section class="queue-drawer" id="queueDrawer" aria-label="当前播放队列" aria-hidden="true">
      <div class="queue-drawer-head">
        <div>
          <span class="eyebrow">Up Next</span>
          <h2>播放队列</h2>
        </div>
        <button class="icon-button" id="queueClose" type="button" aria-label="关闭播放队列">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div class="queue-list compact" id="miniQueueList" aria-label="底部播放队列"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
