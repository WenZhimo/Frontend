<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Braille Chinese Checkers Terminal</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="Braille Chinese Checkers terminal">
      <form class="seed-bar" autocomplete="off">
        <label for="seed-input">SEED</label>
        <input id="seed-input" maxlength="100" spellcheck="false" inputmode="text" aria-label="100 character ASCII seed" />
        <button id="seed-random" type="button">RANDOM</button>
        <button id="seed-copy" type="button">COPY</button>
        <button type="submit">PLAY</button>
        <output id="seed-status">READY</output>
      </form>
      <section class="terminal-shell" aria-label="Chinese Checkers terminal output">
        <canvas id="terminal"></canvas>
      </section>
      <p class="sr-only">
        A terminal-style Chinese Checkers board rendered with Braille dot-matrix characters.
      </p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
