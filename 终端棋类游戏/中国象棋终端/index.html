<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Braille Dot Matrix Xiangqi Terminal</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="Braille dot matrix xiangqi terminal">
      <form class="seed-bar" autocomplete="off">
        <label for="seed-input">SEED</label>
        <input id="seed-input" maxlength="100" spellcheck="false" inputmode="text" aria-label="100 character ASCII seed" />
        <div class="mode-toggle" aria-label="Match mode">
          <button class="mode-button is-active" type="button" data-mode="deterministic" aria-pressed="true">REPLAY</button>
          <button class="mode-button" type="button" data-mode="live" aria-pressed="false">LIVE</button>
        </div>
        <button id="seed-random" type="button">RANDOM</button>
        <button id="seed-copy" type="button">COPY</button>
        <button type="submit">PLAY</button>
        <output id="seed-status">READY</output>
      </form>
      <section class="terminal-shell" aria-label="Xiangqi terminal output">
        <canvas id="terminal"></canvas>
      </section>
      <p class="sr-only">
        A terminal-style Chinese chess board rendered with Braille dot-matrix characters.
      </p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
