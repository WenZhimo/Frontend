<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BangBangJump 模型预览</title>
  <script type="module" src="vendor/model-viewer.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f6f0;
      --ink: #15171f;
      --muted: #626676;
      --line: #ddd8cb;
      --panel: #ffffff;
      --accent: #e84a5f;
      --accent-2: #168f86;
      --soft: #f0eee7;
      --shadow: 0 22px 60px rgba(24, 27, 35, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing: 0;
    }

    button,
    input,
    a {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 28px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      min-width: 0;
    }

    .brand img {
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(24, 27, 35, 0.16);
    }

    h1 {
      display: grid;
      gap: 1px;
      margin: 0;
      max-width: 100%;
      font-size: 26px;
      line-height: 1;
      font-weight: 780;
      letter-spacing: 0;
    }

    h1 span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .search {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel);
      outline: none;
    }

    .search:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(22, 143, 134, 0.15);
    }

    .model-list {
      display: grid;
      gap: 10px;
      overflow: auto;
      padding-right: 3px;
    }

    .model-button {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 64px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .model-button:hover,
    .model-button:focus-visible {
      border-color: rgba(232, 74, 95, 0.6);
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(24, 27, 35, 0.1);
      outline: none;
    }

    .model-button.active {
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(232, 74, 95, 0.16);
    }

    .model-button img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--soft);
    }

    .model-name {
      display: block;
      overflow: hidden;
      font-size: 15px;
      font-weight: 750;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-file {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-size {
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .stage {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 18px;
      min-width: 0;
      padding: 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
    }

    .active-title {
      min-width: 0;
    }

    .active-title h2 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(24px, 4vw, 56px);
      line-height: 0.98;
      font-weight: 820;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font-size: 13px;
      font-weight: 780;
      text-decoration: none;
      cursor: pointer;
    }

    .action.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .viewer-wrap {
      position: relative;
      min-height: 460px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(245, 241, 232, 0.94)),
        radial-gradient(circle at 20% 20%, rgba(22, 143, 134, 0.13), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(232, 74, 95, 0.12), transparent 34%);
      box-shadow: var(--shadow);
    }

    model-viewer {
      width: 100%;
      height: min(72vh, 760px);
      min-height: 460px;
      --poster-color: transparent;
      background: transparent;
    }

    .status {
      position: absolute;
      left: 18px;
      bottom: 16px;
      max-width: calc(100% - 36px);
      padding: 9px 12px;
      border: 1px solid rgba(21, 23, 31, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(10px);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .footer span {
      overflow-wrap: anywhere;
    }

    .footer a {
      color: var(--accent);
      font-weight: 760;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 880px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .model-list {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        max-height: none;
      }

      .topbar,
      .footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }

      .viewer-wrap,
      model-viewer {
        min-height: 380px;
      }

      model-viewer {
        height: 58vh;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/icons/app-icon.png" alt="" />
        <div>
          <h1><span>BangBangJump</span><span>模型预览</span></h1>
          <p class="subtitle">12 个角色 GLB 已从资源包中恢复并嵌入贴图。</p>
        </div>
      </div>
      <input class="search" id="search" type="search" placeholder="搜索角色" autocomplete="off" />
      <div class="model-list" id="modelList" aria-label="模型列表"></div>
    </aside>

    <section class="stage">
      <div class="topbar">
        <div class="active-title">
          <h2 id="activeName">Anon</h2>
          <div class="meta">
            <span class="pill" id="activeSize">3.37 MB</span>
            <span class="pill">GLB</span>
            <span class="pill">1 mesh / 1 texture</span>
          </div>
        </div>
        <div class="actions">
          <button class="action" id="resetView" type="button">重置视角</button>
          <button class="action" id="rotateToggle" type="button">暂停旋转</button>
          <a class="action primary" id="downloadLink" href="models/Anon.glb" download>下载 GLB</a>
        </div>
      </div>

      <div class="viewer-wrap">
        <model-viewer id="viewer" src="models/Anon.glb" alt="Anon model" camera-controls auto-rotate
          auto-rotate-delay="0" rotation-per-second="22deg" shadow-intensity="0.72" exposure="1" tone-mapping="neutral"
          camera-orbit="35deg 68deg 2.85m" field-of-view="32deg" min-camera-orbit="auto auto 0.4m"
          max-camera-orbit="auto auto 9m">
        </model-viewer>
        <div class="status" id="status">载入中：models/Anon.glb</div>
      </div>

      <div class="footer">
        <span>来源：视频网站 BiliBili 的 UP 主 <a href="https://space.bilibili.com/325899087" target="_blank"
            rel="noopener noreferrer">四四四四四老师</a>；GLB 模型已从授权资源包恢复并导出。</span>
        <span>生成日期：2026-09-17</span>
      </div>
    </section>
  </main>

  <script>
    const models = [
      { name: "Anon", file: "models/Anon.glb", size: "3.37 MB", icon: "assets/icons/avatar_Anon.png" },
      { name: "Mutsumi", file: "models/Mutsumi.glb", size: "1.29 MB", icon: "assets/icons/avatar_Mutsumi.png" },
      { name: "MutsumiLight", file: "models/MutsumiLight.glb", size: "3.16 MB", icon: "assets/icons/avatar_Mutsumi.png" },
      { name: "MutsumiStage", file: "models/MutsumiStage.glb", size: "3.33 MB", icon: "assets/icons/avatar_Mutsumi.png" },
      { name: "Nyamu", file: "models/Nyamu.glb", size: "3.11 MB", icon: "assets/icons/avatar_Nyamu.png" },
      { name: "Rana", file: "models/Rana.glb", size: "3.21 MB", icon: "assets/icons/avatar_Rana.png" },
      { name: "Sakiko1", file: "models/Sakiko1.glb", size: "3.31 MB", icon: "assets/icons/avatar_Sakiko1.png" },
      { name: "Soyo", file: "models/Soyo.glb", size: "3.13 MB", icon: "assets/icons/avatar_Soyo.png" },
      { name: "Taki", file: "models/Taki.glb", size: "3.10 MB", icon: "assets/icons/avatar_Taki.png" },
      { name: "Tomori", file: "models/Tomori.glb", size: "3.09 MB", icon: "assets/icons/avatar_Tomori.png" },
      { name: "Uika", file: "models/Uika.glb", size: "3.04 MB", icon: "assets/icons/avatar_Uika.png" },
      { name: "Umiri", file: "models/Umiri.glb", size: "3.09 MB", icon: "assets/icons/avatar_Umiri.png" }
    ];

    const list = document.querySelector("#modelList");
    const search = document.querySelector("#search");
    const viewer = document.querySelector("#viewer");
    const activeName = document.querySelector("#activeName");
    const activeSize = document.querySelector("#activeSize");
    const status = document.querySelector("#status");
    const downloadLink = document.querySelector("#downloadLink");
    const rotateToggle = document.querySelector("#rotateToggle");
    let active = models[0];

    function renderList(filter = "") {
      const query = filter.trim().toLowerCase();
      const visible = models.filter((model) => model.name.toLowerCase().includes(query));
      list.innerHTML = "";
      for (const model of visible) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `model-button${model.name === active.name ? " active" : ""}`;
        button.setAttribute("aria-pressed", model.name === active.name ? "true" : "false");
        button.innerHTML = `
          <img src="${model.icon}" alt="" loading="lazy">
          <span>
            <span class="model-name">${model.name}</span>
            <span class="model-file">${model.file}</span>
          </span>
          <span class="model-size">${model.size}</span>
        `;
        button.addEventListener("click", () => selectModel(model));
        list.appendChild(button);
      }
    }

    function selectModel(model) {
      active = model;
      activeName.textContent = model.name;
      activeSize.textContent = model.size;
      downloadLink.href = model.file;
      downloadLink.download = `${model.name}.glb`;
      viewer.src = model.file;
      viewer.alt = `${model.name} model`;
      status.textContent = `载入中：${model.file}`;
      renderList(search.value);
    }

    viewer.addEventListener("load", () => {
      status.textContent = `已载入：${active.file}`;
    });

    viewer.addEventListener("error", () => {
      status.textContent = `载入失败：${active.file}`;
    });

    search.addEventListener("input", (event) => renderList(event.target.value));

    document.querySelector("#resetView").addEventListener("click", () => {
      viewer.cameraOrbit = "35deg 68deg 2.85m";
      viewer.fieldOfView = "32deg";
      viewer.jumpCameraToGoal();
    });

    rotateToggle.addEventListener("click", () => {
      viewer.autoRotate = !viewer.autoRotate;
      rotateToggle.textContent = viewer.autoRotate ? "暂停旋转" : "开始旋转";
    });

    customElements.whenDefined("model-viewer").catch(() => {
      status.textContent = "三维预览组件未加载，下载链接仍可用。";
    });

    renderList();
  </script>
</body>

</html>
