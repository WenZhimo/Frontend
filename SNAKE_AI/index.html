<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SNAKE_AI Test Harness</title>
    <style>
        :root {
            --bg: #070a0c;
            --panel: rgba(7, 10, 12, 0.86);
            --panel-strong: rgba(10, 14, 16, 0.95);
            --grid: rgba(255, 255, 255, 0.045);
            --text: #d8d8d8;
            --muted: #9aa7b0;
            --gold: #c89a2e;
            --cyan: #00e5ff;
            --warn: #ffb700;
            --danger: #d45134;
            --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            height: 100vh;
            height: 100dvh;
            background:
                radial-gradient(circle at top right, rgba(0, 229, 255, 0.08), transparent 30%),
                linear-gradient(180deg, #050709, #0a0d10);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            display: grid;
            grid-template-columns: minmax(320px, 420px) 1fr;
            overflow: hidden;
        }

        .sidebar {
            position: relative;
            padding: 28px 22px 24px;
            background: linear-gradient(180deg, rgba(8, 10, 12, 0.96), rgba(8, 10, 12, 0.88));
            border-right: 1px solid rgba(200, 154, 46, 0.16);
            box-shadow: var(--shadow);
            display: grid;
            gap: 18px;
            overflow-y: auto;
        }

        .sidebar::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 36px 36px;
            opacity: 0.28;
        }

        .sidebar>* {
            position: relative;
            z-index: 1;
        }

        .status-line {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #8bcfd6;
            font-family: monospace, sans-serif;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: var(--cyan);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.52);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 2.8rem);
            line-height: 1.05;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 12px rgba(200, 154, 46, 0.22);
        }

        .lede {
            color: var(--muted);
            line-height: 1.75;
            margin: 0;
            font-size: 0.98rem;
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(200, 154, 46, 0.16);
            padding: 16px 16px 18px;
            box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.02);
        }

        .panel-title {
            margin: 0 0 14px;
            color: var(--gold);
            font-family: monospace, sans-serif;
            font-size: 0.86rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .field {
            display: grid;
            gap: 8px;
            margin-bottom: 14px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        label {
            font-size: 0.82rem;
            letter-spacing: 1px;
            color: #a8b4bc;
            font-family: monospace, sans-serif;
            text-transform: uppercase;
        }

        select,
        input[type="range"],
        button {
            width: 100%;
        }

        select,
        input[type="range"] {
            background: rgba(8, 12, 14, 0.9);
            color: var(--text);
            border: 1px solid rgba(200, 154, 46, 0.16);
            padding: 10px 12px;
            font-size: 0.95rem;
        }

        button {
            border: 1px solid rgba(200, 154, 46, 0.22);
            background: rgba(12, 16, 20, 0.88);
            color: var(--text);
            padding: 10px 14px;
            font-family: monospace, sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.22s ease;
        }

        button:hover {
            border-color: var(--cyan);
            color: #fff;
            background: rgba(0, 36, 42, 0.84);
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.12);
        }

        .button-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .telemetry {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .telemetry-card {
            padding: 12px;
            background: rgba(9, 12, 14, 0.88);
            border: 1px solid rgba(0, 229, 255, 0.08);
        }

        .telemetry-label {
            font-size: 0.72rem;
            color: #7e8b92;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: monospace, sans-serif;
        }

        .telemetry-value {
            margin-top: 8px;
            font-size: 1.2rem;
            color: var(--gold);
            font-family: monospace, sans-serif;
        }

        .note-box {
            border-left: 3px solid var(--cyan);
            padding: 10px 0 10px 12px;
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.08), transparent);
            color: #d5dbe0;
            line-height: 1.65;
            font-size: 0.95rem;
        }

        .canvas-shell {
            position: relative;
            min-width: 0;
            padding: 30px;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }

        .canvas-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 42px 42px;
            opacity: 0.22;
            pointer-events: none;
        }

        .arena {
            position: relative;
            flex: 1;
            min-height: 0;
            background: rgba(8, 10, 12, 0.88);
            border: 1px solid rgba(200, 154, 46, 0.18);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: absolute;
            top: 18px;
            right: 18px;
            padding: 10px 12px;
            background: rgba(8, 10, 12, 0.82);
            border: 1px solid rgba(200, 154, 46, 0.14);
            color: #d7dbe0;
            font-family: monospace, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            max-width: 280px;
            backdrop-filter: blur(8px);
        }

        .hud strong {
            color: var(--cyan);
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        @media (max-width: 980px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, auto) minmax(0, 1fr);
            }

            .sidebar {
                max-height: min(50dvh, 50vh);
            }

            .canvas-shell {
                min-height: 0;
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="status-line"><span class="status-dot"></span><span>[ SNAKE AI TEST BENCH : ONLINE ]</span></div>
        <h1>贪吃蛇 AI 测试台</h1>
        <p class="lede">用于本地调试当前蛇引擎、A* 安全策略与哈密尔顿类策略。你可以直接切换策略、调整速度与网格尺寸，并观察运行轨迹。</p>

        <section class="panel">
            <h2 class="panel-title">[ CONTROL SURFACE ]</h2>
            <div class="field">
                <label for="strategySelect">Active Strategy</label>
                <select id="strategySelect"></select>
            </div>
            <div class="field">
                <label for="speedRange">Tick Rate</label>
                <input id="speedRange" type="range" min="2" max="300" value="7" />
            </div>
            <div class="field">
                <label for="cellRange">Target Cell Size</label>
                <input id="cellRange" type="range" min="18" max="56" value="32" />
            </div>
            <div class="button-row">
                <button id="pauseBtn" type="button">PAUSE</button>
                <button id="stepBtn" type="button">STEP</button>
                <button id="resetBtn" type="button">RESET</button>
            </div>
        </section>

        <section class="panel">
            <h2 class="panel-title">[ TELEMETRY ]</h2>
            <div class="telemetry">
                <div class="telemetry-card">
                    <div class="telemetry-label">Columns</div>
                    <div class="telemetry-value" id="telemetryCols">--</div>
                </div>
                <div class="telemetry-card">
                    <div class="telemetry-label">Rows</div>
                    <div class="telemetry-value" id="telemetryRows">--</div>
                </div>
                <div class="telemetry-card">
                    <div class="telemetry-label">Length</div>
                    <div class="telemetry-value" id="telemetryLength">--</div>
                </div>
                <div class="telemetry-card">
                    <div class="telemetry-label">Food</div>
                    <div class="telemetry-value" id="telemetryFood">--</div>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2 class="panel-title">[ ENGINEERING NOTE ]</h2>
            <div class="note-box" id="strategyDescription">正在等待策略初始化…</div>
        </section>
    </aside>

    <main class="canvas-shell">
        <div class="arena">
            <canvas id="snakeCanvas"></canvas>
            <div class="hud" id="hud"><strong>Strategy</strong><span>loading…</span></div>
        </div>
    </main>

    <script type="module">
        import { createSnakeEngine } from './snake_core/engine.js';
        import { STRATEGY_MANIFEST, listStrategies, createStrategyById } from './snake_strategy/registry.js';

        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const strategySelect = document.getElementById('strategySelect');
        const speedRange = document.getElementById('speedRange');
        const cellRange = document.getElementById('cellRange');
        const pauseBtn = document.getElementById('pauseBtn');
        const stepBtn = document.getElementById('stepBtn');
        const resetBtn = document.getElementById('resetBtn');
        const hud = document.getElementById('hud');
        const strategyDescription = document.getElementById('strategyDescription');
        const telemetryCols = document.getElementById('telemetryCols');
        const telemetryRows = document.getElementById('telemetryRows');
        const telemetryLength = document.getElementById('telemetryLength');
        const telemetryFood = document.getElementById('telemetryFood');

        let engine = null;
        let strategy = null;
        let strategyMeta = null;
        let running = true;
        let lastTick = 0;
        let tickInterval = 1000 / Number(speedRange.value);
        let targetCellSize = Number(cellRange.value);
        let gridConfig = { columns: 16, rows: 12, cellSize: 32 };
        let resizeObserver = null;
        const strategyCatalog = listStrategies();

        function populateStrategyOptions() {
            strategySelect.innerHTML = '';
            for (const meta of strategyCatalog) {
                const option = document.createElement('option');
                option.value = meta.id;
                option.textContent = meta.label;
                strategySelect.appendChild(option);
            }
        }

        function getArenaSize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            return {
                width: Math.max(320, Math.floor(rect.width)),
                height: Math.max(360, Math.floor(rect.height)),
            };
        }

        function getSelectedStrategyId() {
            return STRATEGY_MANIFEST[strategySelect.value] ? strategySelect.value : (strategyCatalog[0]?.id || 'astar-safe');
        }

        function normalizeGridForStrategy(strategyId, columns, rows) {
            if (strategyId !== 'hamiltonian-cycle' && strategyId !== 'hamiltonian-shortcuts') {
                return { columns, rows };
            }

            if (columns % 2 === 1 && rows % 2 === 1) {
                if (columns >= rows && columns > 10) {
                    return { columns: columns - 1, rows };
                }
                if (rows > 8) {
                    return { columns, rows: rows - 1 };
                }
                return { columns: columns - 1, rows };
            }

            return { columns, rows };
        }

        function computeGrid(strategyId = getSelectedStrategyId()) {
            const { width, height } = getArenaSize();
            const baseColumns = Math.max(10, Math.floor(width / targetCellSize));
            const baseRows = Math.max(8, Math.floor(height / targetCellSize));
            const { columns, rows } = normalizeGridForStrategy(strategyId, baseColumns, baseRows);
            const cellSize = Math.min(width / columns, height / rows);
            gridConfig = { columns, rows, cellSize };
            canvas.width = width;
            canvas.height = height;
        }

        async function createStrategy(id) {
            const selectedId = STRATEGY_MANIFEST[id] ? id : (strategyCatalog[0]?.id || 'astar-safe');
            const meta = STRATEGY_MANIFEST[selectedId];
            const instance = await createStrategyById(selectedId, engine);
            strategyMeta = meta;
            strategy = instance.runner;
            strategyDescription.textContent = meta.description;
            hud.innerHTML = `<strong>Strategy</strong><span>${meta.label}</span>`;
        }

        async function rebuildSimulation(strategyId = getSelectedStrategyId()) {
            computeGrid(strategyId);
            engine = createSnakeEngine({
                columns: gridConfig.columns,
                rows: gridConfig.rows,
                growthStep: 1,
            });
            await createStrategy(strategyId);
            drawFrame();
        }

        async function resizeSimulation() {
            if (!engine) return;
            const strategyId = getSelectedStrategyId();
            computeGrid(strategyId);
            engine.resize(gridConfig.columns, gridConfig.rows);
            await createStrategy(strategyId);
            drawFrame();
        }

        function updateTelemetry() {
            if (!engine) return;
            const state = engine.getState();
            telemetryCols.textContent = state.columns;
            telemetryRows.textContent = state.rows;
            telemetryLength.textContent = state.length;
            telemetryFood.textContent = state.food ? `${state.food.x},${state.food.y}` : '--';
        }

        function drawGrid() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#070a0c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;

            for (let x = 0; x <= gridConfig.columns; x += 1) {
                const px = Math.round(x * gridConfig.cellSize) + 0.5;
                ctx.beginPath();
                ctx.moveTo(px, 0);
                ctx.lineTo(px, gridConfig.rows * gridConfig.cellSize);
                ctx.stroke();
            }

            for (let y = 0; y <= gridConfig.rows; y += 1) {
                const py = Math.round(y * gridConfig.cellSize) + 0.5;
                ctx.beginPath();
                ctx.moveTo(0, py);
                ctx.lineTo(gridConfig.columns * gridConfig.cellSize, py);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawSnake() {
            const state = engine.getState();
            const body = state.body;
            const head = state.head;
            if (!body || body.length === 0) return;

            body.forEach((cell, index) => {
                const isHead = head && cell.x === head.x && cell.y === head.y;
                const x = cell.x * gridConfig.cellSize;
                const y = cell.y * gridConfig.cellSize;
                const inset = 2;

                const gradient = ctx.createLinearGradient(x, y, x + gridConfig.cellSize, y + gridConfig.cellSize);
                if (isHead) {
                    gradient.addColorStop(0, '#00e5ff');
                    gradient.addColorStop(1, '#ffd166');
                } else {
                    gradient.addColorStop(0, '#c89a2e');
                    gradient.addColorStop(1, '#8e6c21');
                }

                ctx.fillStyle = gradient;
                ctx.fillRect(x + inset, y + inset, gridConfig.cellSize - inset * 2, gridConfig.cellSize - inset * 2);

                if (isHead) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.36)';
                    ctx.strokeRect(x + inset + 1, y + inset + 1, gridConfig.cellSize - inset * 2 - 2, gridConfig.cellSize - inset * 2 - 2);
                }
            });
        }

        function drawFood() {
            const state = engine.getState();
            if (!state.food) return;
            const x = state.food.x * gridConfig.cellSize;
            const y = state.food.y * gridConfig.cellSize;
            const size = gridConfig.cellSize - 8;

            ctx.save();
            ctx.fillStyle = '#d45134';
            ctx.shadowBlur = 16;
            ctx.shadowColor = 'rgba(212,81,52,0.55)';
            ctx.fillRect(x + 4, y + 4, size, size);
            ctx.restore();
        }

        function drawFrame() {
            drawGrid();
            drawSnake();
            drawFood();
            updateTelemetry();
        }

        function tick() {
            if (!strategy) return;
            strategy.tick();
            drawFrame();
        }

        function loop(timestamp) {
            if (running && timestamp - lastTick >= tickInterval) {
                lastTick = timestamp;
                tick();
            }
            requestAnimationFrame(loop);
        }

        strategySelect.addEventListener('change', async () => {
            if (!engine) return;
            await rebuildSimulation(getSelectedStrategyId());
        });

        speedRange.addEventListener('input', () => {
            tickInterval = 1000 / Number(speedRange.value);
        });

        cellRange.addEventListener('input', () => {
            targetCellSize = Number(cellRange.value);
            resizeSimulation();
        });

        pauseBtn.addEventListener('click', () => {
            running = !running;
            pauseBtn.textContent = running ? 'PAUSE' : 'RESUME';
        });

        stepBtn.addEventListener('click', () => {
            if (running) {
                running = false;
                pauseBtn.textContent = 'RESUME';
            }
            tick();
        });

        resetBtn.addEventListener('click', async () => {
            await rebuildSimulation();
        });

        async function boot() {
            populateStrategyOptions();
            strategySelect.value = strategyCatalog[0]?.id || 'astar-safe';
            await rebuildSimulation();

            resizeObserver = new ResizeObserver(() => {
                resizeSimulation();
            });
            resizeObserver.observe(canvas.parentElement);

            requestAnimationFrame(loop);
        }

        boot().catch((error) => {
            console.error('[SNAKE_AI] boot failed', error);
            strategyDescription.textContent = `初始化失败：${error.message}`;
            hud.innerHTML = '<strong>Strategy</strong><span>boot failed</span>';
        });
    </script>
</body>

</html>
