<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake AI 评估报告</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #070a0c;
      --panel: rgba(7, 10, 12, 0.86);
      --text: #d8d8d8;
      --muted: #9aa7b0;
      --gold: #c89a2e;
      --cyan: #00e5ff;
      --danger: #d45134;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, rgba(0, 229, 255, 0.08), transparent 30%), linear-gradient(180deg, #050709, #0a0d10); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; padding: 24px; }
    h1 { margin: 0 0 8px; color: var(--gold); }
    p { color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 18px 0 24px; }
    .card, .panel { background: var(--panel); border: 1px solid rgba(200, 154, 46, 0.16); padding: 14px; }
    .label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .value { margin-top: 8px; font-size: 1.2rem; color: var(--gold); font-family: monospace, sans-serif; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    canvas { width: 100% !important; height: 360px !important; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.92rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
  </style>
</head>
<body>
  <h1>Snake AI 评估报告</h1>
  <p>展示模型 summary、按棋盘尺寸结果，以及候选模型与 baseline 的比较。</p>
  <div class="cards" id="summary-cards"></div>
  <div class="grid">
    <div class="panel"><canvas id="summaryChart"></canvas></div>
    <div class="panel"><canvas id="boardScoreChart"></canvas></div>
    <div class="panel"><canvas id="boardFramesChart"></canvas></div>
    <div class="panel"><canvas id="comparisonChart"></canvas></div>
  </div>
  <div class="panel" style="margin-top: 18px;">
    <h2 style="margin-top:0;color:var(--gold);font-size:1.1rem;">模型摘要</h2>
    <table id="summary-table"></table>
  </div>
  <script>
    const payload = {"generatedAt": "2026-05-22T07:03:31.630655+00:00", "reports": [{"model": "D:\\盒子\\HTML\\SNAKE_AI\\artifacts\\models\\exports\\pc\\best-of-batch.json", "avgFitness": 3.777893186295716e+22, "avgSelectionScore": 125326.5, "avgScore": 38.0, "avgFrames": 3012.5, "avgSurvivalRatio": 1.0, "avgApproachAppleEvents": 1757.5, "avgRepeatCellCount": 2662.5, "avgStallSteps": 1254.0, "fitnessStd": 3.777893186295716e+22, "selectionScoreStd": 123541.0, "scoreWeight": 3000.0, "survivalWeight": 100.0, "rawFitnessWeight": 0.1, "rawFitnessCap": 300.0, "zeroScorePenalty": 50.0, "approachAppleWeight": 12.0, "repeatCellPenalty": 3.0, "stallPenalty": 1.5, "results": [{"boardSize": [32, 18], "episode": 0, "fitness": 7.555786372591432e+22, "selectionScore": 248867.5, "score": 76.0, "frames": 5448.0, "survivalRatio": 1.0, "approachAppleEvents": 3224.0, "repeatCellCount": 4872.0, "stallSteps": 2223.0, "uniqueHeadCells": 576.0}, {"boardSize": [32, 18], "episode": 1, "fitness": 578.0, "selectionScore": 1785.5, "score": 0.0, "frames": 577.0, "survivalRatio": 1.0, "approachAppleEvents": 291.0, "repeatCellCount": 453.0, "stallSteps": 285.0, "uniqueHeadCells": 124.0}], "label": "best-of-batch.json"}, {"model": "D:\\盒子\\HTML\\SNAKE_AI\\artifacts\\models\\exports\\pc\\pc-1000-1619844-000.json", "avgFitness": 4398047051325.283, "avgSelectionScore": 74560.04513888889, "avgScore": 23.0, "avgFrames": 1045.5, "avgSurvivalRatio": 0.6779513888888888, "avgApproachAppleEvents": 686.0, "avgRepeatCellCount": 744.0, "avgStallSteps": 358.5, "fitnessStd": 4398047046713.676, "selectionScoreStd": 64291.45486111111, "scoreWeight": 3000.0, "survivalWeight": 100.0, "rawFitnessWeight": 0.1, "rawFitnessCap": 300.0, "zeroScorePenalty": 50.0, "approachAppleWeight": 12.0, "repeatCellPenalty": 3.0, "stallPenalty": 1.5, "results": [{"boardSize": [32, 18], "episode": 0, "fitness": 4611.607519652728, "selectionScore": 10268.590277777777, "score": 3.0, "frames": 205.0, "survivalRatio": 0.3559027777777778, "approachAppleEvents": 120.0, "repeatCellCount": 37.0, "stallSteps": 84.0, "uniqueHeadCells": 168.0}, {"boardSize": [32, 18], "episode": 1, "fitness": 8796094098038.959, "selectionScore": 138851.5, "score": 43.0, "frames": 1886.0, "survivalRatio": 1.0, "approachAppleEvents": 1252.0, "repeatCellCount": 1451.0, "stallSteps": 633.0, "uniqueHeadCells": 435.0}], "label": "pc-1000-1619844-000.json"}, {"model": "D:\\盒子\\HTML\\SNAKE_AI\\artifacts\\models\\exports\\pc\\pc-1000-23-000.json", "avgFitness": 4.722366483007085e+21, "avgSelectionScore": 183718.0, "avgScore": 55.5, "avgFrames": 4107.0, "avgSurvivalRatio": 1.0, "avgApproachAppleEvents": 2510.0, "avgRepeatCellCount": 3546.0, "avgStallSteps": 1596.0, "fitnessStd": 4.722366482732207e+21, "selectionScoreStd": 57382.5, "scoreWeight": 3000.0, "survivalWeight": 100.0, "rawFitnessWeight": 0.1, "rawFitnessCap": 300.0, "zeroScorePenalty": 50.0, "approachAppleWeight": 12.0, "repeatCellPenalty": 3.0, "stallPenalty": 1.5, "results": [{"boardSize": [32, 18], "episode": 0, "fitness": 9.444732965739293e+21, "selectionScore": 241100.5, "score": 73.0, "frames": 5465.0, "survivalRatio": 1.0, "approachAppleEvents": 3321.0, "repeatCellCount": 4889.0, "stallSteps": 2143.0, "uniqueHeadCells": 576.0}, {"boardSize": [32, 18], "episode": 1, "fitness": 274878564755.85315, "selectionScore": 126335.5, "score": 38.0, "frames": 2749.0, "survivalRatio": 1.0, "approachAppleEvents": 1699.0, "repeatCellCount": 2203.0, "stallSteps": 1049.0, "uniqueHeadCells": 546.0}], "label": "pc-1000-23-000.json"}], "boardSummaries": [{"model": "D:\\盒子\\HTML\\SNAKE_AI\\artifacts\\models\\exports\\pc\\best-of-batch.json", "label": "best-of-batch.json", "items": [{"boardSize": [32, 18], "avgSelectionScore": 125326.5, "avgFitness": 3.777893186295716e+22, "avgScore": 38.0, "avgFrames": 3012.5, "avgSurvivalRatio": 1.0}]}, {"model": "D:\\盒子\\HTML\\SNAKE_AI\\artifacts\\models\\exports\\pc\\pc-1000-1619844-000.json", "label": "pc-1000-1619844-000.json", "items": [{"boardSize": [32, 18], "avgSelectionScore": 74560.04513888889, "avgFitness": 4398047051325.283, "avgScore": 23.0, "avgFrames": 1045.5, "avgSurvivalRatio": 0.6779513888888888}]}, {"model": "D:\\盒子\\HTML\\SNAKE_AI\\artifacts\\models\\exports\\pc\\pc-1000-23-000.json", "label": "pc-1000-23-000.json", "items": [{"boardSize": [32, 18], "avgSelectionScore": 183718.0, "avgFitness": 4.722366483007085e+21, "avgScore": 55.5, "avgFrames": 4107.0, "avgSurvivalRatio": 1.0}]}], "comparison": null};
    const reports = payload.reports || [];
    const boardSummaries = payload.boardSummaries || [];
    const comparison = payload.comparison || null;

    function fixed(value, digits = 2) { return Number.isFinite(value) ? value.toFixed(digits) : '--'; }
    const labels = reports.map(report => report.label || report.model.split(/[\/]/).pop());
    document.getElementById('summary-cards').innerHTML = [
      ['Models', reports.length],
      ['Generated At', (payload.generatedAt || '').replace('T', ' ').slice(0, 19)],
      ['Comparison', comparison ? (comparison.better ? 'Candidate Better' : 'Keep Baseline') : '--'],
    ].map(([label, value]) => `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`).join('');

    function barChart(id, title, datasets, labels) {
      new Chart(document.getElementById(id), {
        type: 'bar',
        data: { labels, datasets },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#d8d8d8' } }, title: { display: true, text: title, color: '#c89a2e' } }, scales: { x: { ticks: { color: '#9aa7b0' } }, y: { ticks: { color: '#9aa7b0' } } } }
      });
    }

    barChart('summaryChart', '模型总体摘要', [
      { label: 'Selection Score', data: reports.map(r => r.avgSelectionScore), backgroundColor: 'rgba(0,229,255,0.55)' },
      { label: 'Avg Score', data: reports.map(r => r.avgScore), backgroundColor: 'rgba(200,154,46,0.55)' },
      { label: 'Avg Frames', data: reports.map(r => r.avgFrames), backgroundColor: 'rgba(123,216,143,0.55)' },
    ], labels);

    const boardLabels = Array.from(new Set(boardSummaries.flatMap(item => item.items.map(entry => `${entry.boardSize[0]}x${entry.boardSize[1]}`))));
    barChart('boardScoreChart', '按棋盘尺寸 Avg Score', boardSummaries.map((entry, idx) => ({
      label: entry.label || entry.model.split(/[\/]/).pop(),
      data: boardLabels.map(label => {
        const item = entry.items.find(board => `${board.boardSize[0]}x${board.boardSize[1]}` === label);
        return item ? item.avgScore : null;
      }),
      backgroundColor: ['rgba(0,229,255,0.55)','rgba(200,154,46,0.55)','rgba(123,216,143,0.55)','rgba(138,125,255,0.55)'][idx % 4],
    })), boardLabels);
    barChart('boardFramesChart', '按棋盘尺寸 Avg Frames', boardSummaries.map((entry, idx) => ({
      label: entry.label || entry.model.split(/[\/]/).pop(),
      data: boardLabels.map(label => {
        const item = entry.items.find(board => `${board.boardSize[0]}x${board.boardSize[1]}` === label);
        return item ? item.avgFrames : null;
      }),
      backgroundColor: ['rgba(255,183,0,0.55)','rgba(0,229,255,0.55)','rgba(200,154,46,0.55)','rgba(123,216,143,0.55)'][idx % 4],
    })), boardLabels);

    const comparisonLabels = comparison ? ['Selection Δ', 'Fitness Δ', 'Score Δ', 'Frames Δ'] : [];
    barChart('comparisonChart', 'Candidate vs Baseline 差值', comparison ? [{
      label: 'Delta',
      data: [comparison.deltas.selection, comparison.deltas.fitness, comparison.deltas.score, comparison.deltas.frames],
      backgroundColor: ['rgba(0,229,255,0.55)','rgba(200,154,46,0.55)','rgba(123,216,143,0.55)','rgba(212,81,52,0.55)'],
    }] : [{ label: 'No Comparison', data: [] }], comparisonLabels);

    const table = document.getElementById('summary-table');
    table.innerHTML = `<thead><tr><th>模型</th><th>选择分</th><th>苹果数</th><th>存活步数</th><th>选择分标准差</th></tr></thead><tbody>${reports.map(report => `<tr><td>${report.label || report.model}</td><td>${fixed(report.avgSelectionScore)}</td><td>${fixed(report.avgScore)}</td><td>${fixed(report.avgFrames)}</td><td>${fixed(report.selectionScoreStd)}</td></tr>`).join('')}</tbody>`;
  </script>
</body>
</html>
