<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake AI 评估报告</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {{
      --bg: #070a0c;
      --panel: rgba(7, 10, 12, 0.86);
      --text: #d8d8d8;
      --muted: #9aa7b0;
      --gold: #c89a2e;
      --cyan: #00e5ff;
      --danger: #d45134;
    }}
    * {{ box-sizing: border-box; }}
    body {{ margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, rgba(0, 229, 255, 0.08), transparent 30%), linear-gradient(180deg, #050709, #0a0d10); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; padding: 24px; }}
    h1 {{ margin: 0 0 8px; color: var(--gold); }}
    p {{ color: var(--muted); }}
    .cards {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 18px 0 24px; }}
    .card, .panel {{ background: var(--panel); border: 1px solid rgba(200, 154, 46, 0.16); padding: 14px; }}
    .label {{ font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }}
    .value {{ margin-top: 8px; font-size: 1.2rem; color: var(--gold); font-family: monospace, sans-serif; }}
    .grid {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }}
    canvas {{ width: 100% !important; height: 280px !important; }}
    table {{ width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.92rem; }}
    th, td {{ padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: right; }}
    th:first-child, td:first-child {{ text-align: left; }}
  </style>
</head>
<body>
  <h1>Snake AI 评估报告</h1>
  <p>展示模型 summary、按棋盘尺寸结果，以及候选模型与 baseline 的比较。</p>
  <div class="cards" id="summary-cards"></div>
  <div class="grid">
    <div class="panel"><canvas id="summaryChart"></canvas></div>
    <div class="panel"><canvas id="boardScoreChart"></canvas></div>
    <div class="panel"><canvas id="boardFramesChart"></canvas></div>
    <div class="panel"><canvas id="comparisonChart"></canvas></div>
  </div>
  <div class="panel" style="margin-top: 18px;">
    <h2 style="margin-top:0;color:var(--gold);font-size:1.1rem;">模型摘要</h2>
    <table id="summary-table"></table>
  </div>
  <script>
    const payload = {"generatedAt": "2026-05-21T03:17:28.176410+00:00", "reports": [{"model": "D:\\盒子\\HTML\\SNAKE_AI\\snake_models\\exports\\pc\\best-of-batch.json", "avgFitness": 27945342438.821243, "avgSelectionScore": 62937.125, "avgScore": 20.1, "avgFrames": 581.4, "avgSurvivalRatio": 0.96875, "avgApproachAppleEvents": 350.3, "avgRepeatCellCount": 449.4, "avgStallSteps": 230.1, "fitnessStd": 82320977573.73169, "selectionScoreStd": 32951.59746985911, "scoreWeight": 3000.0, "survivalWeight": 100.0, "rawFitnessWeight": 0.1, "rawFitnessCap": 300.0, "zeroScorePenalty": 50.0, "approachAppleWeight": 12.0, "repeatCellPenalty": 3.0, "stallPenalty": 1.5, "results": [{"boardSize": [8, 8], "episode": 0, "fitness": 49306.01706420211, "selectionScore": 27913.0, "score": 9.0, "frames": 170.0, "survivalRatio": 1.0, "approachAppleEvents": 101.0, "repeatCellCount": 109.0, "stallSteps": 68.0, "uniqueHeadCells": 61.0}, {"boardSize": [8, 8], "episode": 1, "fitness": 755893.1218822742, "selectionScore": 58493.5, "score": 19.0, "frames": 340.0, "survivalRatio": 1.0, "approachAppleEvents": 200.0, "repeatCellCount": 276.0, "stallSteps": 139.0, "uniqueHeadCells": 64.0}, {"boardSize": [10, 10], "episode": 0, "fitness": 4502011.902072715, "selectionScore": 68197.0, "score": 22.0, "frames": 513.0, "survivalRatio": 1.0, "approachAppleEvents": 302.0, "repeatCellCount": 414.0, "stallSteps": 210.0, "uniqueHeadCells": 99.0}, {"boardSize": [10, 10], "episode": 1, "fitness": 268946774.3859392, "selectionScore": 86605.0, "score": 28.0, "frames": 594.0, "survivalRatio": 1.0, "approachAppleEvents": 359.0, "repeatCellCount": 494.0, "stallSteps": 234.0, "uniqueHeadCells": 100.0}, {"boardSize": [12, 12], "episode": 0, "fitness": 2097.6506754141647, "selectionScore": 6671.75, "score": 2.0, "frames": 99.0, "survivalRatio": 0.6875, "approachAppleEvents": 58.0, "repeatCellCount": 21.0, "stallSteps": 40.0, "uniqueHeadCells": 78.0}, {"boardSize": [12, 12], "episode": 1, "fitness": 4295634633.759232, "selectionScore": 99359.5, "score": 32.0, "frames": 748.0, "survivalRatio": 1.0, "approachAppleEvents": 458.0, "repeatCellCount": 611.0, "stallSteps": 289.0, "uniqueHeadCells": 137.0}, {"boardSize": [14, 14], "episode": 0, "fitness": 2373152.032125449, "selectionScore": 65902.0, "score": 21.0, "frames": 555.0, "survivalRatio": 1.0, "approachAppleEvents": 356.0, "repeatCellCount": 401.0, "stallSteps": 198.0, "uniqueHeadCells": 154.0}, {"boardSize": [14, 14], "episode": 1, "fitness": 46192.88684256775, "selectionScore": 28784.5, "score": 9.0, "frames": 377.0, "survivalRatio": 1.0, "approachAppleEvents": 213.0, "repeatCellCount": 219.0, "stallSteps": 163.0, "uniqueHeadCells": 158.0}, {"boardSize": [16, 16], "episode": 0, "fitness": 2358716.1611468424, "selectionScore": 66697.0, "score": 21.0, "frames": 806.0, "survivalRatio": 1.0, "approachAppleEvents": 481.0, "repeatCellCount": 573.0, "stallSteps": 324.0, "uniqueHeadCells": 233.0}, {"boardSize": [16, 16], "episode": 1, "fitness": 274878755610.2955, "selectionScore": 120748.0, "score": 38.0, "frames": 1612.0, "survivalRatio": 1.0, "approachAppleEvents": 975.0, "repeatCellCount": 1376.0, "stallSteps": 636.0, "uniqueHeadCells": 236.0}]}], "boardSummaries": [{"model": "D:\\盒子\\HTML\\SNAKE_AI\\snake_models\\exports\\pc\\best-of-batch.json", "items": [{"boardSize": [8, 8], "avgSelectionScore": 43203.25, "avgFitness": 402599.56947323814, "avgScore": 14.0, "avgFrames": 255.0, "avgSurvivalRatio": 1.0}, {"boardSize": [10, 10], "avgSelectionScore": 77401.0, "avgFitness": 136724393.14400595, "avgScore": 25.0, "avgFrames": 553.5, "avgSurvivalRatio": 1.0}, {"boardSize": [12, 12], "avgSelectionScore": 53015.625, "avgFitness": 2147818365.7049537, "avgScore": 17.0, "avgFrames": 423.5, "avgSurvivalRatio": 0.84375}, {"boardSize": [14, 14], "avgSelectionScore": 47343.25, "avgFitness": 1209672.4594840084, "avgScore": 15.0, "avgFrames": 466.0, "avgSurvivalRatio": 1.0}, {"boardSize": [16, 16], "avgSelectionScore": 93722.5, "avgFitness": 137440557163.2283, "avgScore": 29.5, "avgFrames": 1209.0, "avgSurvivalRatio": 1.0}]}], "comparison": null};
    const reports = payload.reports || [];
    const boardSummaries = payload.boardSummaries || [];
    const comparison = payload.comparison || null;

    function fixed(value, digits = 2) {{ return Number.isFinite(value) ? value.toFixed(digits) : '--'; }}
    const labels = reports.map(report => report.model.split(/[\/]/).pop());
    document.getElementById('summary-cards').innerHTML = [
      ['Models', reports.length],
      ['Generated At', (payload.generatedAt || '').replace('T', ' ').slice(0, 19)],
      ['Comparison', comparison ? (comparison.better ? 'Candidate Better' : 'Keep Baseline') : '--'],
    ].map(([label, value]) => `<div class="card"><div class="label">${{label}}</div><div class="value">${{value}}</div></div>`).join('');

    function barChart(id, title, datasets, labels) {{
      new Chart(document.getElementById(id), {{
        type: 'bar',
        data: {{ labels, datasets }},
        options: {{ responsive: true, maintainAspectRatio: false, plugins: {{ legend: {{ labels: {{ color: '#d8d8d8' }} }}, title: {{ display: true, text: title, color: '#c89a2e' }} }}, scales: {{ x: {{ ticks: {{ color: '#9aa7b0' }} }}, y: {{ ticks: {{ color: '#9aa7b0' }} }} }} }}
      }});
    }}

    barChart('summaryChart', '模型总体摘要', [
      {{ label: 'Selection Score', data: reports.map(r => r.avgSelectionScore), backgroundColor: 'rgba(0,229,255,0.55)' }},
      {{ label: 'Avg Score', data: reports.map(r => r.avgScore), backgroundColor: 'rgba(200,154,46,0.55)' }},
      {{ label: 'Avg Frames', data: reports.map(r => r.avgFrames), backgroundColor: 'rgba(123,216,143,0.55)' }},
    ], labels);

    const boardLabels = Array.from(new Set(boardSummaries.flatMap(item => item.items.map(entry => `${{entry.boardSize[0]}}x${{entry.boardSize[1]}}`))));
    barChart('boardScoreChart', '按棋盘尺寸 Avg Score', boardSummaries.map((entry, idx) => ({
      label: entry.model.split(/[\/]/).pop(),
      data: boardLabels.map(label => {{
        const item = entry.items.find(board => `${{board.boardSize[0]}}x${{board.boardSize[1]}}` === label);
        return item ? item.avgScore : null;
      }}),
      backgroundColor: ['rgba(0,229,255,0.55)','rgba(200,154,46,0.55)','rgba(123,216,143,0.55)','rgba(138,125,255,0.55)'][idx % 4],
    })), boardLabels);
    barChart('boardFramesChart', '按棋盘尺寸 Avg Frames', boardSummaries.map((entry, idx) => ({
      label: entry.model.split(/[\/]/).pop(),
      data: boardLabels.map(label => {{
        const item = entry.items.find(board => `${{board.boardSize[0]}}x${{board.boardSize[1]}}` === label);
        return item ? item.avgFrames : null;
      }}),
      backgroundColor: ['rgba(255,183,0,0.55)','rgba(0,229,255,0.55)','rgba(200,154,46,0.55)','rgba(123,216,143,0.55)'][idx % 4],
    })), boardLabels);

    const comparisonLabels = comparison ? ['Selection Δ', 'Fitness Δ', 'Score Δ', 'Frames Δ'] : [];
    barChart('comparisonChart', 'Candidate vs Baseline 差值', comparison ? [{
      label: 'Delta',
      data: [comparison.deltas.selection, comparison.deltas.fitness, comparison.deltas.score, comparison.deltas.frames],
      backgroundColor: ['rgba(0,229,255,0.55)','rgba(200,154,46,0.55)','rgba(123,216,143,0.55)','rgba(212,81,52,0.55)'],
    }] : [{ label: 'No Comparison', data: [] }], comparisonLabels);

    const table = document.getElementById('summary-table');
    table.innerHTML = `<thead><tr><th>模型</th><th>选择分</th><th>苹果数</th><th>存活步数</th><th>选择分标准差</th></tr></thead><tbody>${{reports.map(report => `<tr><td>${{report.model}}</td><td>${{fixed(report.avgSelectionScore)}}</td><td>${{fixed(report.avgScore)}}</td><td>${{fixed(report.avgFrames)}}</td><td>${{fixed(report.selectionScoreStd)}}</td></tr>`).join('')}}</tbody>`;
  </script>
</body>
</html>
