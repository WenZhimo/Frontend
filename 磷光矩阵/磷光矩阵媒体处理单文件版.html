<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>磷光矩阵本地资源处理演示</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --panel: #12151b;
      --panel-2: #181c23;
      --ink: #edf4ff;
      --muted: #9aa8b7;
      --line: #29313b;
      --cyan: #75d8ff;
      --green: #79e6a1;
      --amber: #ffcf6b;
      --red: #ff7f7f;
      --control: #222832;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      line-height: 1.45;
    }

    button,
    input,
    select { font: inherit; }

    button {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--control);
      color: var(--ink);
      cursor: pointer;
    }

    button:hover { border-color: var(--cyan); }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      min-height: 100vh;
    }

    .stage {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        #05070a;
      background-size: 32px 32px;
    }

    .topbar,
    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 9, 13, 0.9);
    }

    .statusbar {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .title {
      display: grid;
      gap: 2px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .canvasWrap {
      display: grid;
      min-height: 0;
      padding: 18px;
    }

    .renderCanvas {
      width: 100%;
      height: 100%;
      min-height: 420px;
      border: 1px solid #1f2630;
      border-radius: var(--radius);
      background: #010307;
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100vh;
      background: var(--panel);
    }

    .sidebarHeader {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .sidebarBody {
      display: grid;
      gap: 16px;
      align-content: start;
      overflow: auto;
      padding: 18px;
    }

    .section {
      display: grid;
      gap: 12px;
    }

    .section h2 {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .dropZone {
      display: grid;
      gap: 8px;
      padding: 16px;
      border: 1px dashed #3c4856;
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--muted);
    }

    .dropZone[data-active="true"] {
      border-color: var(--cyan);
      background: #10212a;
    }

    .fileInput { display: none; }

    .buttonRow {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .sourceButton,
    .primaryButton {
      min-height: 36px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 650;
    }

    .primaryButton {
      border-color: #34718a;
      background: #123141;
      color: #dff8ff;
    }

    .sourceButton[aria-pressed="true"] {
      border-color: var(--green);
      background: #163528;
      color: #eafff1;
    }

    .control {
      display: grid;
      gap: 7px;
    }

    .controlHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .control output {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }

    select {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--control);
      color: var(--ink);
      padding: 0 10px;
    }

    .previewMedia,
    .sourceCanvas {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #05070a;
      object-fit: cover;
    }

    .hidden { display: none; }

    .metricGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      display: grid;
      gap: 3px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-2);
    }

    .metric span {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .metric strong {
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .error {
      color: var(--red);
      font-size: 13px;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 58vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .sidebar {
        min-height: auto;
      }

      .renderCanvas {
        min-height: 360px;
      }
    }

    @media (max-width: 560px) {
      .topbar,
      .statusbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .buttonRow,
      .metricGrid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="磷光矩阵处理输出">
      <header class="topbar">
        <div class="title">
          <h1>磷光矩阵本地资源处理</h1>
          <p class="subtitle">图片、视频和 canvas 直接作为 WebGL 纹理输入</p>
        </div>
        <button id="toggleRender" class="primaryButton" type="button">暂停</button>
      </header>
      <div class="canvasWrap">
        <canvas id="mediaMount" class="renderCanvas" aria-label="磷光矩阵渲染结果"></canvas>
      </div>
      <footer class="statusbar">
        <span id="sourceLabel">Canvas 源</span>
        <span id="statusText">WebGL2 初始化中</span>
      </footer>
    </section>

    <aside class="sidebar" aria-label="资源与渲染参数">
      <header class="sidebarHeader">
        <div class="title">
          <h2>控制台</h2>
          <p class="subtitle">拖入本地图片或视频，或切回内置动态 canvas。</p>
        </div>
      </header>
      <div class="sidebarBody">
        <section class="section">
          <h2>本地资源</h2>
          <label id="dropZone" class="dropZone" for="fileInput">
            <strong>选择或拖拽文件</strong>
            <span>支持 PNG、JPG、WebP、MP4、WebM 等浏览器可解码格式。</span>
          </label>
          <input id="fileInput" class="fileInput" type="file" accept="image/*,.svg,.svgz,video/*">
          <div class="buttonRow">
            <button class="sourceButton" type="button" data-source="canvas" aria-pressed="true">Canvas</button>
            <button class="sourceButton" type="button" data-source="image" aria-pressed="false">示例图</button>
            <button class="sourceButton" type="button" data-source="video" aria-pressed="false">示例视频</button>
          </div>
          <img id="imageSource" class="previewMedia hidden" alt="示例或本地图片源">
          <video id="videoSource" class="previewMedia hidden" muted loop playsinline controls></video>
          <canvas id="videoGenerator" class="hidden" aria-hidden="true"></canvas>
          <canvas id="canvasSource" class="sourceCanvas" aria-label="动态 canvas 源"></canvas>
          <p id="errorText" class="error" role="alert"></p>
        </section>

        <section class="section">
          <h2>输入适配</h2>
          <label class="control">
            <span class="controlHead"><span>画面适配</span></span>
            <select id="fitMode">
              <option value="contain" selected>适应画布</option>
              <option value="cover">覆盖画布</option>
              <option value="fit-width">按宽度填满</option>
              <option value="fit-height">按高度填满</option>
              <option value="stretch">拉伸填满</option>
            </select>
          </label>
          <label class="control">
            <span class="controlHead"><span>质量</span></span>
            <select id="qualityMode">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high" selected>High</option>
            </select>
          </label>
        </section>

        <section class="section">
          <h2>视觉参数</h2>
          <label class="control">
            <span class="controlHead"><span>矩阵间距</span><output id="pitchValue">5</output></span>
            <input id="pitchControl" type="range" min="3" max="12" value="5" step="1">
          </label>
          <label class="control">
            <span class="controlHead"><span>发光强度</span><output id="bloomValue">1.18</output></span>
            <input id="bloomControl" type="range" min="0.65" max="1.7" value="1.18" step="0.01">
          </label>
          <label class="control">
            <span class="controlHead"><span>扩散</span><output id="diffusionValue">0.50</output></span>
            <input id="diffusionControl" type="range" min="0.15" max="0.8" value="0.50" step="0.01">
          </label>
          <label class="control">
            <span class="controlHead"><span>噪声</span><output id="noiseValue">0.026</output></span>
            <input id="noiseControl" type="range" min="0" max="0.08" value="0.026" step="0.002">
          </label>
        </section>

        <section class="section">
          <h2>运行状态</h2>
          <div class="metricGrid">
            <div class="metric"><span>Backend</span><strong id="backendMetric">pending</strong></div>
            <div class="metric"><span>Source</span><strong id="sourceMetric">pending</strong></div>
            <div class="metric"><span>Canvas</span><strong id="canvasMetric">pending</strong></div>
            <div class="metric"><span>FPS</span><strong id="fpsMetric">--</strong></div>
          </div>
          <p class="note">这个页面不采样 DOM。资源画面进入 WebGL 纹理后，矩阵、发光、bloom、噪声和暗场合成都在 GPU pass 中完成。</p>
        </section>
      </div>
    </aside>
  </main>

  <script>
(function () {
  "use strict";

  const PHOSPHOR_DEFAULT_CONFIG = {
    target: null,
    mount: null,
    backend: "webgl2",
    quality: "medium",
    motionMode: "realtime",
    accessibilityMode: "preserveDom",
    maxDpr: 1,
    frameRate: 45,
    sourceFrameInterval: 520,
    sourceScale: 0.55,
    matrixPitch: 8,
    cellFillRatio: 0.42,
    threshold: 0.055,
    brightness: 1.18,
    contrast: 1.36,
    coreIntensity: 1.48,
    bloomRadius: 22,
    bloomStrength: 1.08,
    diffusionStrength: 0.48,
    blackLevel: 0.94,
    noiseAmount: 0.026,
    vignetteStrength: 0.42,
    flickerAmount: 0.025,
    opacity: 1,
    phosphorPalette: {
      core: [235, 244, 255],
      hot: [164, 204, 255],
      glow: [98, 128, 255],
      outer: [48, 52, 176],
      black: [2, 5, 12],
    },
  };

  const QUALITY_PRESETS = {
    low: {
      maxDpr: 1,
      frameRate: 30,
      sourceFrameInterval: 720,
      sourceScale: 0.42,
      matrixPitch: 10,
      bloomRadius: 16,
      bloomStrength: 0.88,
      diffusionStrength: 0.32,
    },
    medium: {
      maxDpr: 1,
      frameRate: 45,
      sourceFrameInterval: 520,
      sourceScale: 0.55,
      matrixPitch: 8,
      bloomRadius: 22,
      bloomStrength: 1.08,
      diffusionStrength: 0.42,
    },
    high: {
      maxDpr: 1.25,
      frameRate: 60,
      sourceFrameInterval: 420,
      sourceScale: 0.66,
      matrixPitch: 5,
      bloomRadius: 28,
      bloomStrength: 1.18,
      diffusionStrength: 0.5,
    },
  };

  const FULLSCREEN_VERTEX_SHADER = `#version 300 es
precision highp float;

in vec2 a_position;
out vec2 v_uv;

void main() {
  v_uv = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}
`;

  const MATRIX_EMISSION_FRAGMENT_SHADER = `#version 300 es
precision highp float;

uniform sampler2D u_source;
uniform vec2 u_resolution;
uniform vec4 u_sourceRect;
uniform vec4 u_outputRect;
uniform float u_matrixPitch;
uniform float u_cellFillRatio;
uniform float u_threshold;
uniform float u_brightness;
uniform float u_contrast;
uniform float u_coreIntensity;
uniform vec3 u_coreColor;
uniform vec3 u_hotColor;
uniform vec3 u_glowColor;

in vec2 v_uv;
out vec4 outColor;

float luminance(vec3 color) {
  return dot(color, vec3(0.2126, 0.7152, 0.0722));
}

void main() {
  vec2 pixel = v_uv * u_resolution;
  vec2 cell = floor(pixel / u_matrixPitch);
  vec2 cellOrigin = cell * u_matrixPitch;
  vec2 local = (pixel - cellOrigin) / u_matrixPitch;
  vec2 centerDelta = abs(local - 0.5);
  float squareDistance = max(centerDelta.x, centerDelta.y);
  float cellHalf = u_cellFillRatio * 0.5;
  float bodyMask = smoothstep(cellHalf + 0.02, cellHalf - 0.02, squareDistance);
  float glowMask = smoothstep(0.86, 0.18, length(local - 0.5));

  vec2 baseUv = (cellOrigin + vec2(0.5) * u_matrixPitch) / u_resolution;
  vec2 contentUv = (baseUv - u_outputRect.xy) / u_outputRect.zw;
  vec2 inside = step(vec2(0.0), contentUv) * step(contentUv, vec2(1.0));
  float outputMask = inside.x * inside.y;
  vec2 sampleUv = u_sourceRect.xy + contentUv * u_sourceRect.zw;
  vec4 sourceSample = texture(u_source, clamp(sampleUv, vec2(0.0), vec2(1.0)));
  float sourceAlpha = sourceSample.a * outputMask;
  float energy = max(0.0, (luminance(sourceSample.rgb) * sourceAlpha - u_threshold) * u_contrast);
  energy = pow(clamp(energy, 0.0, 1.0), 0.78) * u_brightness;

  float hot = pow(clamp(energy, 0.0, 1.0), 1.55);
  vec3 bodyColor = mix(u_hotColor, u_coreColor, hot);
  float coreMask = smoothstep(0.18, 0.02, length(local - 0.5));
  vec3 glow = u_glowColor * energy * glowMask * 0.5;
  vec3 body = bodyColor * energy * bodyMask * 0.92;
  vec3 core = u_coreColor * max(0.0, energy - 0.34) * coreMask * u_coreIntensity;
  vec3 color = glow + body + core;

  outColor = vec4(color, clamp(max(max(color.r, color.g), color.b), 0.0, 1.0) * sourceAlpha);
}
`;

  const BLOOM_FRAGMENT_SHADER = `#version 300 es
precision highp float;

uniform sampler2D u_texture;
uniform vec2 u_texel;
uniform float u_radius;
uniform float u_strength;
uniform vec3 u_glowColor;

in vec2 v_uv;
out vec4 outColor;

void main() {
  vec4 sum = vec4(0.0);
  sum += texture(u_texture, v_uv) * 0.18;
  sum += texture(u_texture, v_uv + vec2( u_texel.x, 0.0) * u_radius) * 0.12;
  sum += texture(u_texture, v_uv + vec2(-u_texel.x, 0.0) * u_radius) * 0.12;
  sum += texture(u_texture, v_uv + vec2(0.0,  u_texel.y) * u_radius) * 0.12;
  sum += texture(u_texture, v_uv + vec2(0.0, -u_texel.y) * u_radius) * 0.12;
  sum += texture(u_texture, v_uv + vec2( u_texel.x,  u_texel.y) * u_radius * 0.72) * 0.085;
  sum += texture(u_texture, v_uv + vec2(-u_texel.x,  u_texel.y) * u_radius * 0.72) * 0.085;
  sum += texture(u_texture, v_uv + vec2( u_texel.x, -u_texel.y) * u_radius * 0.72) * 0.085;
  sum += texture(u_texture, v_uv + vec2(-u_texel.x, -u_texel.y) * u_radius * 0.72) * 0.085;
  vec3 color = mix(sum.rgb, sum.rgb * u_glowColor * 1.85, 0.42);
  outColor = vec4(color * u_strength, sum.a);
}
`;

  const COMPOSE_FRAGMENT_SHADER = `#version 300 es
precision highp float;

uniform sampler2D u_emission;
uniform sampler2D u_bloomA;
uniform sampler2D u_bloomB;
uniform vec2 u_resolution;
uniform float u_time;
uniform float u_matrixPitch;
uniform float u_noiseAmount;
uniform float u_vignetteStrength;
uniform float u_diffusionStrength;
uniform float u_flickerAmount;
uniform float u_opacity;
uniform vec3 u_blackColor;

in vec2 v_uv;
out vec4 outColor;

float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

void main() {
  vec2 pixel = v_uv * u_resolution;
  vec3 emission = texture(u_emission, v_uv).rgb;
  vec3 bloomA = texture(u_bloomA, v_uv).rgb;
  vec3 bloomB = texture(u_bloomB, v_uv).rgb;

  float flicker = 1.0 + sin(u_time * 0.013) * u_flickerAmount;
  vec3 color = u_blackColor;
  color += bloomB * (0.86 + u_diffusionStrength * 0.55);
  color += bloomA * 0.66;
  color += emission * u_opacity * flicker;

  vec2 grid = abs(fract(pixel / u_matrixPitch) - 0.5);
  float gridLine = 1.0 - smoothstep(0.42, 0.5, max(grid.x, grid.y));
  color += vec3(0.015, 0.024, 0.075) * gridLine;

  float n = hash(pixel + u_time * 0.021);
  color += vec3(n * 0.6, n * 0.72, n) * u_noiseAmount;

  float dist = distance(v_uv, vec2(0.5));
  float vignette = smoothstep(0.28, 0.86, dist) * u_vignetteStrength;
  color *= 1.0 - vignette;

  outColor = vec4(color, 1.0);
}
`;

  function createPhosphorConfig(config = {}) {
    const quality = config.quality || PHOSPHOR_DEFAULT_CONFIG.quality;
    const preset = QUALITY_PRESETS[quality] || QUALITY_PRESETS.medium;
    return {
      ...PHOSPHOR_DEFAULT_CONFIG,
      ...preset,
      ...config,
      quality,
      phosphorPalette: {
        ...PHOSPHOR_DEFAULT_CONFIG.phosphorPalette,
        ...(config.phosphorPalette || {}),
      },
    };
  }

  function applyQualityPreset(currentConfig, quality) {
    return createPhosphorConfig({
      ...currentConfig,
      ...(QUALITY_PRESETS[quality] || QUALITY_PRESETS.medium),
      quality,
    });
  }

  function resizeCanvas(canvas, width, height) {
    const nextWidth = Math.max(1, Math.round(width));
    const nextHeight = Math.max(1, Math.round(height));
    if (canvas.width !== nextWidth || canvas.height !== nextHeight) {
      canvas.width = nextWidth;
      canvas.height = nextHeight;
    }
  }

  function normalizeColor(color) {
    return [color[0] / 255, color[1] / 255, color[2] / 255];
  }

  function isVideoReady(source) {
    return !(source instanceof HTMLVideoElement) ||
      (source.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && source.videoWidth > 0 && source.videoHeight > 0);
  }

  function shouldReallocateTexture(source) {
    return source instanceof HTMLVideoElement || source instanceof HTMLImageElement;
  }

  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const message = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(`WebGL shader compile failed: ${message}`);
    }
    return shader;
  }

  function createProgram(gl, vertexSource, fragmentSource) {
    const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexSource);
    const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      const message = gl.getProgramInfoLog(program);
      gl.deleteProgram(program);
      gl.deleteShader(vertexShader);
      gl.deleteShader(fragmentShader);
      throw new Error(`WebGL program link failed: ${message}`);
    }
    gl.deleteShader(vertexShader);
    gl.deleteShader(fragmentShader);
    return program;
  }

  function createTexture(gl, width, height, options = {}) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, options.filter || gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, options.filter || gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, Math.max(1, width), Math.max(1, height), 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    return texture;
  }

  function resizeTexture(gl, texture, width, height) {
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, Math.max(1, width), Math.max(1, height), 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  }

  function setTextureImage(gl, texture, source) {
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  }

    const y = (i * 137) % canvas.height;
    const size = 36 + ((i * 23) % 180);
    ctx.fillStyle = `rgba(${90 + (i % 5) * 28}, ${138 + (i % 7) * 12}, 255, ${0.08 + (i % 4) * 0.045})`;
    ctx.fillRect(x - size * 0.5, y - size * 0.5, size, size);
  }

  ctx.fillStyle = "rgba(3, 8, 18, 0.45)";
  ctx.fillRect(0, canvas.height * 0.64, canvas.width, canvas.height * 0.22);
  ctx.fillStyle = "#eff7ff";
  ctx.font = "700 92px Segoe UI, sans-serif";
  ctx.fillText("GENERATED IMAGE", 86, canvas.height * 0.72);
  ctx.fillStyle = "#78e2ff";
  ctx.font = "500 38px Segoe UI, sans-serif";
  ctx.fillText("origin-clean local demo texture", 92, canvas.height * 0.79);
  return canvas.toDataURL("image/png");
}

function sizeCanvasSource() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvasSource.getBoundingClientRect();
  const width = Math.max(640, Math.round((rect.width || 640) * ratio));
  const height = Math.max(360, Math.round((rect.height || 360) * ratio));
  if (canvasSource.width !== width || canvasSource.height !== height) {
    canvasSource.width = width;
    canvasSource.height = height;
  }
}

function sizeVideoGenerator() {
  if (videoGenerator.width !== 1280 || videoGenerator.height !== 720) {
    videoGenerator.width = 1280;
    videoGenerator.height = 720;
  }
}

function drawCanvasSource(time) {
  sizeCanvasSource();
  const ctx = canvasSource.getContext("2d");
  const w = canvasSource.width;
  const h = canvasSource.height;
  const t = time * 0.001;
  ctx.fillStyle = "#05070a";
  ctx.fillRect(0, 0, w, h);

  const cols = 15;
  const rows = 9;
  for (let y = 0; y < rows; y += 1) {
    for (let x = 0; x < cols; x += 1) {
      const u = x / Math.max(1, cols - 1);
      const v = y / Math.max(1, rows - 1);
      const pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + x * 0.72 + y * 0.44);
      const size = (10 + pulse * 28) * (window.devicePixelRatio || 1);
      ctx.fillStyle = `rgba(${Math.round(120 + pulse * 120)}, ${Math.round(180 + pulse * 70)}, 255, ${0.18 + pulse * 0.72})`;
      ctx.fillRect(u * w - size * 0.5, v * h - size * 0.5, size, size);
    }
  }

  ctx.fillStyle = "#eaf5ff";
  ctx.font = `${Math.round(h * 0.12)}px Segoe UI, sans-serif`;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText("LOCAL CANVAS", w * 0.08, h * 0.42);
  ctx.fillStyle = "#79e6a1";
  ctx.font = `${Math.round(h * 0.052)}px Segoe UI, sans-serif`;
  ctx.fillText("direct WebGL texture source", w * 0.085, h * 0.55);

  requestAnimationFrame(drawCanvasSource);
}

function drawGifSource() {
  const animation = activeGifAnimation;
  if (animation?.frames?.length) {
    updateDecodedGifFrame(animation, performance.now());
  } else if (animation?.image?.complete && animation.image.naturalWidth) {
    drawImageElementToCanvas(animation.image, animation.canvas);
  }
  requestAnimationFrame(drawGifSource);
}

function drawImageElementToCanvas(image, canvas) {
  const width = image.naturalWidth;
  const height = image.naturalHeight;
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, width, height);
  ctx.drawImage(image, 0, 0, width, height);
}

function prepareGifTimeline(frames) {
  let cursor = 0;
  frames.forEach((frame) => {
    frame.startMs = cursor;
    cursor += frame.durationMs;
    frame.endMs = cursor;
  });
  return Math.max(20, cursor);
}

function findGifFrameIndex(animation, time) {
  if (animation.frames.length <= 1) return 0;
  const totalDurationMs = animation.totalDurationMs || prepareGifTimeline(animation.frames);
  const elapsed = ((time - animation.startedAt) % totalDurationMs + totalDurationMs) % totalDurationMs;
  let low = 0;
  let high = animation.frames.length - 1;
  while (low < high) {
    const mid = (low + high) >> 1;
    if (elapsed < animation.frames[mid].endMs) high = mid;
    else low = mid + 1;
  }
  return low;
}

async function updateDecodedGifFrame(animation, time, force = false) {
  if (!animation.frames?.length) return;

  if (!animation.startedAt) {
    animation.startedAt = time;
  }

  const frameIndex = findGifFrameIndex(animation, time);
  if (!force && frameIndex === animation.drawnFrameIndex) return;

  const frame = animation.frames[frameIndex] || animation.frames[0];
  if (animation.canvas.width !== frame.width || animation.canvas.height !== frame.height) {
    animation.canvas.width = frame.width;
    animation.canvas.height = frame.height;
  }

  const ctx = animation.canvas.getContext("2d");
  ctx.clearRect(0, 0, animation.canvas.width, animation.canvas.height);
  ctx.drawImage(frame.bitmap, 0, 0);

  animation.frameIndex = frameIndex;
  animation.drawnFrameIndex = frameIndex;
  animation.nextFrameTime = animation.startedAt + frame.endMs;
}

async function decodeGifFrames(file) {
  const decoder = new ImageDecoder({
    data: await file.arrayBuffer(),
    type: file.type || "image/gif",
  });
  const frames = [];
  const maxFrames = 3000;

  try {
    await decoder.tracks.ready;
    for (let index = 0; index < maxFrames; index += 1) {
      let decoded;
      try {
        decoded = await decoder.decode({ frameIndex: index });
      } catch (error) {
        break;
      }

      const image = decoded.image;
      try {
        frames.push({
          bitmap: await createImageBitmap(image),
          durationMs: Math.max(20, (image.duration || 100000) / 1000),
          width: image.displayWidth,
          height: image.displayHeight,
        });
      } finally {
        image.close();
      }
    }
  } finally {
    decoder.close();
  }

  return frames;
}

async function createGifCanvasSource(file) {
  const canvas = document.createElement("canvas");
  activeGifCanvas = canvas;

  if ("ImageDecoder" in window) {
    const frames = await decodeGifFrames(file);
    if (!frames.length) throw new Error("GIF 鏃犳硶瑙ｇ爜涓哄彲缁樺埗甯с€?");
    const totalDurationMs = prepareGifTimeline(frames);
    activeGifAnimation = {
      canvas,
      frames,
      frameIndex: 0,
      drawnFrameIndex: -1,
      startedAt: performance.now(),
      totalDurationMs,
      nextFrameTime: 0,
    };
    await updateDecodedGifFrame(activeGifAnimation, performance.now(), true);
    return canvas;
  }

  activeGifImage = imageSource;
  activeGifAnimation = { canvas, image: activeGifImage };
  drawImageElementToCanvas(activeGifImage, canvas);
  return canvas;
}

function drawGeneratedVideo(time) {
  sizeVideoGenerator();
  const ctx = videoGenerator.getContext("2d");
  const w = videoGenerator.width;
  const h = videoGenerator.height;
  const t = time * 0.001;
  ctx.fillStyle = "#040813";
  ctx.fillRect(0, 0, w, h);

  const bg = ctx.createRadialGradient(w * 0.5, h * 0.45, 80, w * 0.5, h * 0.45, w * 0.78);
  bg.addColorStop(0, "#1d5b8d");
  bg.addColorStop(0.48, "#0e2446");
  bg.addColorStop(1, "#030711");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 42; i += 1) {
    const x = ((i * 91 + t * (36 + i * 1.7)) % (w + 180)) - 90;
    const y = (Math.sin(t * 0.9 + i * 0.48) * 0.32 + 0.5) * h;
    const size = 18 + (i % 8) * 14;
    const pulse = 0.55 + 0.45 * Math.sin(t * 2.8 + i);
    ctx.fillStyle = `rgba(155, 205, 255, ${0.08 + pulse * 0.34})`;
    ctx.fillRect(x, y, size * 1.8, size);
  }

  ctx.fillStyle = "#eef7ff";
  ctx.font = "700 74px Segoe UI, sans-serif";
  ctx.fillText("GENERATED VIDEO", 72, h * 0.47);
  ctx.fillStyle = "#7ee7ad";
  ctx.font = "500 32px Segoe UI, sans-serif";
  ctx.fillText("canvas.captureStream source", 78, h * 0.55);
  requestAnimationFrame(drawGeneratedVideo);
}

function ensureGeneratedSources() {
  if (!imageSource.src) imageSource.src = createGeneratedImage();
  if (!generatedVideoStream && videoGenerator.captureStream) {
    generatedVideoStream = videoGenerator.captureStream(30);
    videoSource.srcObject = generatedVideoStream;
  }
}

function rendererConfig() {
  return {
    quality: qualityMode.value,
    matrixPitch: Number(pitchControl.value),
    bloomStrength: Number(bloomControl.value),
    diffusionStrength: Number(diffusionControl.value),
    noiseAmount: Number(noiseControl.value),
    maxDpr: qualityMode.value === "high" ? 1.5 : 1.15,
    frameRate: qualityMode.value === "high" ? 60 : qualityMode.value === "medium" ? 45 : 30,
  };
}

function ensureRenderer(source) {
  if (renderer) return renderer;
  renderer = new PhosphorMediaRenderer({
    source,
    mount,
    fit: fitMode.value,
    sourceUpdateMode: "auto",
    ...rendererConfig(),
  });
  window.PhosphorMediaDemo = {
    renderer,
    getState: () => renderer.getState(),
  };
  renderer.start();
  return renderer;
}

function syncMetrics() {
  if (!renderer) return;
  const state = renderer.getState();
  backendMetric.textContent = state.backend;
  sourceMetric.textContent = `${state.source.width} x ${state.source.height}`;
  canvasMetric.textContent = `${state.surface.width} x ${state.surface.height}`;
  statusText.textContent = `${state.backend} · ${state.config.quality} · ${state.fit}`;
  if (state.error && state.error !== "Video source has no drawable frame yet.") {
    setError(`纹理上传失败：${state.error}`);
  }
}

async function setSource(kind, source, label, options = {}) {
  setError();
  updateSourceButtons(kind);
  showSourcePreview(kind);
  sourceLabel.textContent = label;

  if (kind === "image") await waitForImage(source);
  if (kind === "video") {
    await waitForVideo(source);
    try {
      await source.play();
    } catch {
      source.muted = true;
      await source.play();
    }
  }

  const activeRenderer = ensureRenderer(source);
  activeRenderer.setSource(source, {
    fit: fitMode.value,
    sourceUpdateMode: options.sourceUpdateMode || (kind === "image" && !(source instanceof HTMLImageElement) ? "static" : "auto"),
  });
  if (!activeRenderer.getState().running) {
    activeRenderer.start();
    toggleRender.textContent = "暂停";
  }
  requestAnimationFrame(() => {
    activeRenderer.render();
    syncMetrics();
  });
}

async function useBuiltInSource(kind) {
  try {
    ensureGeneratedSources();
    if (kind === "canvas") {
      await setSource("canvas", canvasSource, "Canvas 源");
    } else if (kind === "image") {
      if (activeGifCanvas && activeGifAnimation?.frames?.length) {
        await setSource("image", activeGifCanvas, activeImageLabel || "GIF", { sourceUpdateMode: "realtime" });
        return;
      }
      if (activeImageBitmap) {
        await setSource("image", activeImageBitmap, activeImageLabel || "Image", { sourceUpdateMode: "static" });
        return;
      }
      if (activeSvgCanvas) {
        await setSource("image", activeSvgCanvas, activeImageLabel || "SVG", { sourceUpdateMode: "realtime" });
        return;
      }
      if (activeImageLabel && activeObjectUrl && imageSource.src === activeObjectUrl) {
        await setSource("image", imageSource, activeImageLabel, { sourceUpdateMode: "static" });
        return;
      }
      await setSource("image", imageSource, "示例图像");
    } else {
      await setSource("video", videoSource, "示例视频");
    }
  } catch (error) {
    setError(error.message);
  }
}

async function loadLocalFile(file) {
  if (!file) return;
  try {
    setError();
    revokeObjectUrl();
    if (file.type.startsWith("image/") || isSvgFile(file)) {
      clearActiveImageSource();
      activeObjectUrl = URL.createObjectURL(file);
      imageSource.src = activeObjectUrl;
      activeImageLabel = file.name;
      await waitForImage(imageSource);
      if (isGifFile(file)) {
        const gifCanvas = await createGifCanvasSource(file);
        await restartImagePreviewFromObjectUrl(activeObjectUrl);
        const startTime = performance.now();
        activeGifAnimation.startedAt = startTime;
        activeGifAnimation.drawnFrameIndex = -1;
        await updateDecodedGifFrame(activeGifAnimation, startTime, true);
        await setSource("image", gifCanvas, file.name, { sourceUpdateMode: "realtime" });
      } else if (isSvgFile(file)) {
        activeSvgCanvas = rasterizeSvgImage(imageSource);
        await setSource("image", activeSvgCanvas, file.name, { sourceUpdateMode: "realtime" });
      } else {
        activeImageBitmap = await createImageBitmap(file, { imageOrientation: "flipY" });
        await setSource("image", activeImageBitmap, file.name, { sourceUpdateMode: "static" });
      }
    } else if (file.type.startsWith("video/")) {
      clearActiveImageSource();
      activeObjectUrl = URL.createObjectURL(file);
      videoSource.srcObject = null;
      videoSource.src = activeObjectUrl;
      videoSource.load();
      await setSource("video", videoSource, file.name);
    } else {
      throw new Error("请选择浏览器可解码的图片或视频文件。");
    }
  } catch (error) {
    setError(error.message);
  }
}

function updateRendererConfig() {
  syncOutputs();
  if (!renderer) return;
  renderer.updateConfig(rendererConfig());
  renderer.fit = fitMode.value;
  renderer.render();
  syncMetrics();
}

function tickMetrics(time) {
  frameCount += 1;
  if (time - fpsStart >= 500) {
    fpsMetric.textContent = Math.round((frameCount * 1000) / (time - fpsStart));
    frameCount = 0;
    fpsStart = time;
    syncMetrics();
  }
  requestAnimationFrame(tickMetrics);
}

sourceButtons.forEach((button) => {
  button.addEventListener("click", () => useBuiltInSource(button.dataset.source));
});

fileInput.addEventListener("change", () => loadLocalFile(fileInput.files?.[0]));

["dragenter", "dragover"].forEach((eventName) => {
  window.addEventListener(eventName, (event) => {
    if (!event.dataTransfer?.types?.includes("Files")) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
    dropZone.dataset.active = "true";
  });
});

["dragleave", "drop"].forEach((eventName) => {
  window.addEventListener(eventName, (event) => {
    if (!event.dataTransfer?.types?.includes("Files")) return;
    event.preventDefault();
    dropZone.dataset.active = "false";
  });
});

window.addEventListener("drop", (event) => {
  if (!event.dataTransfer?.types?.includes("Files")) return;
  event.preventDefault();
  loadLocalFile(event.dataTransfer.files?.[0]);
});

toggleRender.addEventListener("click", () => {
  if (!renderer) return;
  if (renderer.getState().running) {
    renderer.stop();
    toggleRender.textContent = "继续";
  } else {
    renderer.start();
    toggleRender.textContent = "暂停";
  }
  syncMetrics();
});

fitMode.addEventListener("change", () => {
  if (!renderer) return;
  renderer.fit = fitMode.value;
  renderer.render();
  syncMetrics();
});

qualityMode.addEventListener("change", () => {
  if (!renderer) return;
  renderer.setQuality(qualityMode.value);
  const state = renderer.getState();
  pitchControl.value = state.config.matrixPitch;
  bloomControl.value = state.config.bloomStrength;
  diffusionControl.value = state.config.diffusionStrength;
  syncOutputs();
  renderer.render();
  syncMetrics();
});

[pitchControl, bloomControl, diffusionControl, noiseControl].forEach((input) => {
  input.addEventListener("input", updateRendererConfig);
});

window.addEventListener("resize", () => {
  sizeCanvasSource();
  renderer?.render();
});

syncOutputs();
sizeCanvasSource();
sizeVideoGenerator();
requestAnimationFrame(drawCanvasSource);
requestAnimationFrame(drawGifSource);
requestAnimationFrame(drawSvgSource);
requestAnimationFrame(drawGeneratedVideo);
requestAnimationFrame(tickMetrics);
ensureGeneratedSources();

if (!PhosphorMediaRenderer) {
  setError("磷光媒体库未加载，请确认 phosphor/media-renderer.global.js 与本页面在同一项目目录。");
  statusText.textContent = "库未加载";
} else if (!PhosphorMediaRenderer.isSupported()) {
  setError("当前浏览器不支持 WebGL2，媒体 shader 演示无法运行。");
  statusText.textContent = "WebGL2 不可用";
} else {
  useBuiltInSource("canvas");
}

  </script>
</body>
</html>
