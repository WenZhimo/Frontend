<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>3D 等高线地形图</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .control-panel {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10;
            box-sizing: border-box;
            width: 300px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 16px;
            color: #f7fbff;
            background: rgba(8, 13, 18, 0.86);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            box-shadow: 0 18px 46px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(10px);
        }

        .control-panel h1 {
            margin: 0 0 14px;
            font-size: 18px;
            line-height: 1.2;
        }

        .control-group {
            display: grid;
            gap: 8px;
            margin: 0 0 14px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
        }

        .control-row output {
            min-width: 54px;
            color: #9ee7ff;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .control-panel label {
            font-weight: 600;
        }

        .control-panel input[type="range"] {
            width: 100%;
            accent-color: #00d8ff;
        }

        .control-panel input[type="number"] {
            box-sizing: border-box;
            width: 100%;
            padding: 8px 9px;
            color: #f7fbff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 6px;
            outline: none;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .color-grid input[type="color"] {
            width: 100%;
            height: 34px;
            padding: 0;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 6px;
            cursor: pointer;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .control-panel button {
            padding: 9px 10px;
            color: #061018;
            font-weight: 700;
            background: #9ee7ff;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        .control-panel button.secondary {
            color: #f7fbff;
            background: rgba(255, 255, 255, 0.13);
        }

        .hint {
            margin: 12px 0 0;
            color: rgba(247, 251, 255, 0.68);
            font-size: 12px;
            line-height: 1.45;
        }

        @media (max-width: 720px) {
            .control-panel {
                top: auto;
                right: 12px;
                bottom: 12px;
                left: 12px;
                width: auto;
                max-height: 46vh;
            }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

    <script src="TerrainDataGenerator.js"></script>
    <script src="ContourVisualizer.js"></script>
</head>

<body>
    <div id="canvas-container"></div>

    <aside class="control-panel" aria-label="地形参数控制">
        <h1>地形参数</h1>

        <div class="control-group">
            <label for="seed-input">随机种子</label>
            <input id="seed-input" type="number" step="1">
        </div>

        <div class="control-group">
            <div class="control-row">
                <label for="roughness-input">粗糙度</label>
                <output id="roughness-value"></output>
            </div>
            <input id="roughness-input" type="range" min="20" max="2400" step="1">
        </div>

        <div class="control-group">
            <div class="control-row">
                <label for="amplitude-input">高度振幅</label>
                <output id="amplitude-value"></output>
            </div>
            <input id="amplitude-input" type="range" min="5" max="1600" step="1">
        </div>

        <div class="control-group">
            <div class="control-row">
                <label for="density-input">等高线密度</label>
                <output id="density-value"></output>
            </div>
            <input id="density-input" type="range" min="1" max="200" step="0.1">
        </div>

        <div class="control-group">
            <div class="control-row">
                <label for="thickness-input">线条粗细</label>
                <output id="thickness-value"></output>
            </div>
            <input id="thickness-input" type="range" min="0.02" max="10" step="0.01">
        </div>

        <div class="control-group">
            <label>渐变颜色</label>
            <div class="color-grid">
                <input id="color-a-input" type="color" aria-label="低地颜色">
                <input id="color-b-input" type="color" aria-label="中段颜色">
                <input id="color-c-input" type="color" aria-label="高地颜色">
            </div>
        </div>

        <div class="button-row">
            <button id="random-seed-button" type="button">随机种子</button>
            <button id="reset-button" class="secondary" type="button">重置</button>
        </div>

        <p class="hint">拖动滑块会实时重建地形。鼠标左键旋转，右键平移，滚轮缩放。</p>
    </aside>

    <script>
        const defaultParams = {
            seed: 999,
            roughness: 60,
            amplitude: 35,
            density: 3.5,
            thickness: 0.1,
            colors: ["#000088", "#00ffff", "#ffff00"]
        };
        const params = { ...defaultParams, colors: [...defaultParams.colors] };
        const controls = {
            seed: document.getElementById('seed-input'),
            roughness: document.getElementById('roughness-input'),
            roughnessValue: document.getElementById('roughness-value'),
            amplitude: document.getElementById('amplitude-input'),
            amplitudeValue: document.getElementById('amplitude-value'),
            density: document.getElementById('density-input'),
            densityValue: document.getElementById('density-value'),
            thickness: document.getElementById('thickness-input'),
            thicknessValue: document.getElementById('thickness-value'),
            colors: [
                document.getElementById('color-a-input'),
                document.getElementById('color-b-input'),
                document.getElementById('color-c-input')
            ],
            randomSeed: document.getElementById('random-seed-button'),
            reset: document.getElementById('reset-button')
        };

        const updateControlValues = () => {
            controls.seed.value = params.seed;
            controls.roughness.value = params.roughness;
            controls.roughnessValue.textContent = params.roughness;
            controls.amplitude.value = params.amplitude;
            controls.amplitudeValue.textContent = params.amplitude;
            controls.density.value = params.density;
            controls.densityValue.textContent = params.density.toFixed(1);
            controls.thickness.value = params.thickness;
            controls.thicknessValue.textContent = params.thickness.toFixed(2);
            controls.colors.forEach((input, index) => {
                input.value = params.colors[index];
            });
        };

        const terrainGen = new TerrainDataGenerator(200, 200, {
            seed: params.seed,
            roughness: params.roughness,
            amplitude: params.amplitude
        });
        const visualizer = new ContourVisualizer('canvas-container', terrainGen, {
            density: params.density,
            thickness: params.thickness,
            colors: params.colors
        });

        const rebuildTerrain = () => {
            terrainGen.updateConfig({
                seed: params.seed,
                roughness: params.roughness,
                amplitude: params.amplitude
            });
            visualizer.density = params.density;
            visualizer.thickness = params.thickness;
            visualizer.colorArray = [...params.colors];
            visualizer.createTerrainMesh();
        };
        const refreshFromControls = () => {
            params.seed = Number.parseInt(controls.seed.value, 10) || defaultParams.seed;
            params.roughness = Number.parseFloat(controls.roughness.value);
            params.amplitude = Number.parseFloat(controls.amplitude.value);
            params.density = Number.parseFloat(controls.density.value);
            params.thickness = Number.parseFloat(controls.thickness.value);
            params.colors = controls.colors.map(input => input.value);
            updateControlValues();
            rebuildTerrain();
        };
        const bindLiveControl = input => {
            input.addEventListener('input', refreshFromControls);
            input.addEventListener('change', refreshFromControls);
        };

        updateControlValues();
        [
            controls.seed,
            controls.roughness,
            controls.amplitude,
            controls.density,
            controls.thickness,
            ...controls.colors
        ].forEach(bindLiveControl);
        controls.randomSeed.addEventListener('click', () => {
            params.seed = Math.floor(Math.random() * 1000000);
            updateControlValues();
            rebuildTerrain();
        });
        controls.reset.addEventListener('click', () => {
            Object.assign(params, defaultParams, { colors: [...defaultParams.colors] });
            updateControlValues();
            rebuildTerrain();
        });

        console.log("地形已生成，请使用鼠标左键旋转，右键平移。");
    </script>
</body>

</html>
