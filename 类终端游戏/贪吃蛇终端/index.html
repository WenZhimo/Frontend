<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Braille Snake Terminal</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="Braille Snake terminal">
      <form class="seed-bar" autocomplete="off">
        <a class="home-link" href="../index.html" aria-label="Back to terminal games hub">HOME</a>
        <label for="seed-input">SEED</label>
        <input
          id="seed-input"
          maxlength="100"
          spellcheck="false"
          inputmode="text"
          placeholder="blank = random 100-char ASCII seed"
          aria-label="100 character ASCII seed"
        />
        <select id="play-mode" aria-label="Play mode">
          <option value="ai">AI AUTOPILOT</option>
          <option value="human">HUMAN PILOT</option>
        </select>
        <select id="ai-select" aria-label="AI strategy"></select>
        <button id="seed-random" type="button">RANDOM</button>
        <button id="seed-copy" type="button">COPY</button>
        <button type="submit">START</button>
        <output id="seed-status">READY</output>
      </form>
      <section class="terminal-shell" aria-label="Snake terminal output">
        <canvas id="terminal"></canvas>
      </section>
      <p class="sr-only">
        A terminal-style Snake game rendered through a fixed character buffer. The snake, apple, trail,
        ripples, and crash effects are drawn as Braille and block characters. AI strategies are loaded
        locally from the SNAKE_AI runtime, with the trained PC neural model enabled.
      </p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
